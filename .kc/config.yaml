config:
  # How long a utility job lives, in seconds. Defaults to 86400 (24 hours).
  ttl: 86400
  # Image used for each kind of utility job. Any key you omit keeps its default.
  images:
    pg: postgres:latest
    mongo: arunvelsriram/utils
    redis: redis:latest
    util: arunvelsriram/utils
    # Used instead of the database image when -pf/--port-forward is given.
    pf: alpine/socat
ctxs:
  <ctx-alias>: <context-name>
apps:
  <app-alias>:
    deployment: <deployment-name>
    namespace: <namespace>
    pg:
      host: <db-host>
      port: <db-port>
      user: <db-user>
      password: <db-password>
      dbname: <db-name>
      pfport: <port-forward-port> # Optional, for port forwarding
    redis:
      host: <redis-host>
      port: <redis-port>
      password: <redis-password>
      pfport: <port-forward-port> # Optional, for port forwarding
    mongo:
      host: <mongo-host>
      user: <mongo-user>
      password: <mongo-password>
      dbname: <mongo-dbname>
      pfport: <port-forward-port> # Optional, for port forwarding
